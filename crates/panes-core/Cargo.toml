[package]
name = "panes-core"
version = "0.1.0"
edition = "2024"

[features]
# Enables helpers for constructing panes-core state in test scaffolding
# of downstream crates (panes-app, integration tests). Never enable in
# production binaries — the helpers bypass the usual `db::initialize`
# bootstrap path (WAL mode, stale-thread recovery) and are tuned for
# fast isolated test setup only.
test-utils = ["dep:tempfile"]

[dependencies]
panes-events = { workspace = true }
panes-adapters = { workspace = true }
panes-memory = { workspace = true }
panes-cost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
regex = "1"
similar = "2"
sha2 = "0.10"
hex = "0.4"
tempfile = { version = "3", optional = true }
# Worktree lifecycle (create/remove/merge) for Phase 2 concurrent threads.
# Scoped narrowly: no SSH / HTTPS / OpenSSL — we only touch local paths.
# vendored-libgit2 keeps the build hermetic (no system libgit2 needed).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"
